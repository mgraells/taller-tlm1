:root{

  --machine-ink:#ffffff;

  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;

  --r:10px;
}

.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--machine);color:var(--machine-ink);padding:12px 16px;display:flex;align-items:center;gap:12px}
header .back{background:none;border:0;color:inherit;font-size:26px;line-height:1;padding:4px 8px 4px 0;cursor:pointer}
header .back[hidden]{display:none}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.8;text-transform:uppercase}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .in{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font:600 13px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--machine)}
nav.tabs button[aria-current="page"]::after{content:"";width:28px;height:3px;border-radius:2px;background:var(--safety);margin-top:2px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--safety);outline-offset:2px}

.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 -6px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:inherit;font:inherit;min-height:118px}
.tile:hover{border-color:var(--machine)}

.plate::before,.plate::after{content:"";position:absolute;top:50%;width:3px;height:3px;border-radius:50%;background:var(--machine-ink);opacity:.6;transform:translateY(-50%)}
.plate::before{left:2px}.plate::after{right:2px}
.tile h3{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.05}

.row{display:flex;align-items:center;gap:12px;padding:14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1}
.row .txt span{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:22px}
.lights{display:flex;gap:3px;flex-wrap:wrap;max-width:110px;justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.hero h2{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1;text-wrap:balance}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.tag.old{background:color-mix(in srgb,var(--safety) 30%,transparent)}
.units{display:flex;gap:6px;flex-wrap:wrap}
.unit{font-family:var(--mono);font-size:13px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;font:600 16px var(--body);color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}

.menu button.wide svg{color:var(--machine-ink)}

details.sec summary .st{margin-left:auto;font:500 12px var(--body);color:var(--muted)}
details.sec[open] summary{border-bottom:1px solid var(--line)}
dl{margin:0;padding:4px 14px 10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);column-gap:12px}
dt,dd{padding:9px 0;border-bottom:1px dashed var(--line);margin:0;font-size:14px}
dt{color:var(--muted)}
dd{font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dd.empty{color:var(--none);font-weight:400}
dt:nth-last-child(2),dd:last-child{border-bottom:0}
.empty-state{text-align:center;padding:32px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty-state svg{width:44px;height:44px;color:var(--machine)}
.empty-state h3{margin:0;color:var(--fg);font-family:var(--display);font-size:22px}
.empty-state p{margin:0;max-width:34ch}
.sync{font-size:12px;color:var(--muted);margin:-4px 0 0;font-family:var(--mono)}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--surface-2);max-width:100%}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.crit{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:6px;font:700 18px var(--display);color:#fff;background:var(--none)}
.crit.cA{background:var(--bad)}.crit.cB{background:var(--warn);color:#1c1400}.crit.cC{background:var(--ok)}
.desc{margin:0;color:var(--fg);max-width:65ch}
.fotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fotos figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.fotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.fotos figcaption{font-size:12px;color:var(--muted)}
.nofoto span{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px;text-align:center;overflow-wrap:anywhere}

.buit{margin:0;padding:12px 14px;color:var(--muted);font-size:14px}
.recs{display:flex;flex-direction:column;gap:8px;padding:10px 14px 14px}
.rec{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}

.rec dl{padding:0 12px 6px;border-top:1px dashed var(--line)}
.pend{color:var(--warn);font-style:italic;font-weight:500}
.na{color:var(--muted);font-weight:400}
dl.plain{padding:0}

const PEND=/^(pendent|no disponible)$/i;
const OCULTS=new Set(["nom","grup","foto_general","foto_placa","descripcio"]);
const COLS_DADA={valors_ref:[2],criticitat:[1,2],manteniment_tipus:[1,2],normativa:[1,2],documentacio:[1,2,3],consumibles:[1,2,3,4,5],formacio:[1,2,3]};
function netejaEtiqueta(t){return String(t).split("\n")[0].replace(/\s*\((com sortirà[^)]*|5-8 línies[^)]*)\)\s*:?.*$/i,"").replace(/\s+$/,"")}
function filaAmbDades(clau,fila){const cols=COLS_DADA[clau];
  return cols?cols.some(i=>fila[i]&&!PEND.test(fila[i])):fila.slice(1).some(v=>v&&!PEND.test(v))||(!fila[0]&&fila.some(Boolean))}
function itemTe(i){return i.valor!==""}
function dadaFitxa(f,clau){for(const p of f.pestanyes)for(const b of p.blocs)if(b.tipus==="dades")for(const i of b.items)if(i.clau===clau)return i.valor;return ""}
function critFinal(f){for(const p of f.pestanyes)for(const b of p.blocs)if(b.tipus==="taula"&&b.clau==="criticitat"){const r=b.files.find(x=>/final/i.test(x[0]));if(r)return {nivell:(r[1]||"").trim().toUpperCase(),just:r[2]||""}}return null}
const valHTML=v=>PEND.test(v)?`<span class="pend">${esc(v)}</span>`:/^no aplica$/i.test(v)?`<span class="na">${esc(v)}</span>`:esc(v);
const badge=l=>`<span class="crit c${esc(l)}" title="Criticitat ${esc(l)}">${esc(l)}</span>`;

/* Converteix una pestanya en grups {títol, html}; descarta el que no té dades */
function pestanyaHTML(p){
  const grups=[];let cur={titol:"",parts:[],n:0};
  const tanca=()=>{if(cur.parts.length)grups.push(cur)};
  for(const b of p.blocs){
    if(b.tipus==="apartat"){tanca();cur={titol:b.titol,parts:[],n:0};continue}
    if(b.tipus==="dades"){const its=b.items.filter(i=>itemTe(i)&&!OCULTS.has(i.clau));
      if(its.length){cur.parts.push(`<dl>${its.map(i=>`<dt>${esc(netejaEtiqueta(i.etiqueta))}</dt><dd>${valHTML(i.valor)}</dd>`).join("")}</dl>`);
        cur.n+=its.filter(i=>!PEND.test(i.valor)).length}}
    if(b.tipus==="taula"){const files=b.files.filter(f=>filaAmbDades(b.clau,f));
      if(files.length){cur.n+=files.length;
        cur.parts.push(`<div class="recs">${files.map(f=>{
          const head=f[0]||"—";
          const rest=b.capcaleres.map((h,i)=>[h,f[i]]).slice(1).filter(([,v])=>v);
          const lvl=rest.find(([h])=>/^nivell/i.test(h));
          return `<div class="rec"><div class="rec-h"><b>${esc(head)}</b>${lvl?badge(String(lvl[1]).trim().toUpperCase()):""}</div>
            ${rest.filter(r=>r!==lvl).length?`<dl>${rest.filter(r=>r!==lvl).map(([h,v])=>`<dt>${esc(netejaEtiqueta(h))}</dt><dd>${valHTML(v)}</dd>`).join("")}</dl>`:""}</div>`}).join("")}</div>`)}}
  }
  tanca();
  return grups;
}

     <h2>${esc(m.nom)}</h2>
     <div class="tags">${m.marca?`<span class="tag">${esc(m.marca)}</span>`:""}${m.model?`<span class="tag">${esc(m.model)}</span>`:""}<span class="tag">${esc(m.tipus.replace(" (abans 1975)",""))}</span>${m.antiga?`<span class="tag old">Anterior a 1975</span>`:""}</div>
     <div class="units">${m.unitats.map(c=>`<span class="unit"><i class="dot ${ESTAT[c]||""}"></i>${pad(c)}</span>`).join("")}</div>
     ${notesEstat(m)}
   </section>
   <div class="menu">
     <button class="wide" id="b-fitxa">${ICON.fitxa}<span>Fitxa de l'equip<br><small style="font-weight:500;opacity:.85">${f?"Revisada · "+esc(f.actualitzada||""):"Pendent de lliurar"}</small></span></button>
     <button data-p="Manteniment de l'equip">${ICON.mant}Manteniment</button>
     <button data-p="Normes de seguretat">${ICON.seg}Seguretat</button>
     <button data-p="Registre d'incidències">${ICON.inc}Incidències</button>
     <button data-p="Tasques de manteniment">${ICON.tasq}Tasques</button>
   </div>`;
  $v.querySelector("#b-fitxa").onclick=()=>go("fitxa",n);
  $v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go("proximament",{m:n,t:b.dataset.p}));
}
function notesEstat(m){const ns=m.unitats.map(c=>[c,(DADES.estat||{})[c]]).filter(([,v])=>v&&v.nota);
  return ns.length?`<ul class="notes">${ns.map(([c,v])=>`<li><i class="dot ${v.estat}"></i><b>${pad(c)}</b> ${esc(v.nota)}</li>`).join("")}</ul>`:""}

function fitxa(n){
  const m=MAQ.find(x=>x.n===n),f=fitxaDe(m);
  setHead("Fitxa de l'equip",m.nom,true);
  if(!f){$v.innerHTML=`<div class="notice">Aquesta fitxa encara no s'ha publicat. Quan la revisis i la desis a la carpeta <b>Fitxes revisades</b> del Drive, apareixerà aquí.</div>
     <section class="hero"><h2>${esc(m.nom)}</h2><dl class="plain"><dt>Codis</dt><dd>${esc(m.codis)}</dd>${m.marca?`<dt>Marca</dt><dd>${esc(m.marca)}</dd>`:""}${m.model?`<dt>Model</dt><dd>${esc(m.model)}</dd>`:""}</dl></section>`;return}
  const desc=dadaFitxa(f,"descripcio"),fg=f.fotos&&f.fotos.general,fp=f.fotos&&f.fotos.placa;
  const fotos=[["Foto general",fg],["Placa de característiques",fp]].filter(([,nm])=>nm);
  const blocs=f.pestanyes.map(p=>({p,g:pestanyaHTML(p)}));
  $v.innerHTML=`
   <section class="hero">
     <p class="eyebrow" style="margin:0">Fitxa ${f.fitxa?String(f.fitxa).padStart(2,"0")+" · ":""}actualitzada ${esc(f.actualitzada||"")}</p>
     <h2>${esc(f.nom||m.nom)}</h2>
     ${desc?`<p class="desc">${esc(desc)}</p>`:""}
     ${fotos.length?`<div class="fotos">${fotos.map(([t,nm])=>{const u=fotoUrl(nm);return u?`<figure><img src="${esc(u)}" alt="${t}" loading="lazy"><figcaption>${t}</figcaption></figure>`:`<figure class="nofoto"><span>${esc(nm)}</span><figcaption>${t} · es veurà quan es carregui del Drive</figcaption></figure>`}).join("")}</div>`:""}
   </section>
   ${blocs.map(({p,g},i)=>{const n2=g.reduce((s,x)=>s+x.n,0);
     return `<details class="sec" ${i===0?"open":""} ${g.length?"":"data-buit"}><summary><span class="n">${esc((p.nom.match(/^[\dA-Za-z-]+/)||[""])[0].replace(/^Annex$/,"A"))}</span>${esc(p.titol.replace(/^\d+\.\s*/,""))}<span class="st">${g.length?(n2?n2+" dades":"Pendent"):"Pendent"}</span></summary>
       ${g.length?g.map(x=>`${x.titol?`<h4>${esc(x.titol)}</h4>`:""}${x.parts.join("")}`).join(""):`<p class="buit">Encara sense dades.</p>`}
     </details>`}).join("")}`;
}

function proximament({m,t}){
  const mq=MAQ.find(x=>x.n===m);
  setHead(t,mq.nom,true);
  $v.innerHTML=`<div class="empty-state">${ICON.fitxa}<h3>${esc(t)}</h3><p>Aquest apartat es connectarà més endavant. De moment, la prioritat és la fitxa de l'equip.</p></div>`;
}
function manteniment(){setHead("Manteniment","Tot el taller",false);
  $v.innerHTML=`<div class="empty-state">${ICON.mant}<h3>Cap tasca pendent</h3><p>Aquí sortiran les tasques de manteniment pendents de totes les màquines, quan es carregui el pla de manteniment.</p></div>`}
function estoc(){setHead("Estoc","Recanvis i consumibles",false);
  $v.innerHTML=`<div class="empty-state">${ICON.caixa}<h3>Estoc sense carregar</h3><p>Aquí es veuran els recanvis crítics i els consumibles de cada màquina, a partir dels apartats 10 a 12 de les fitxes.</p></div>`}

/* Pestanyes */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x===b?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current"));
  stack=[[tab==="maquines"?"home":tab]];render()});

/* Enllaç directe des del QR: #m047 obre la màquina amb codi 47 */
function fromHash(){const h=location.hash.match(/^#m0*(\d+)$/);if(!h)return false;
  const c=+h[1],m=MAQ.find(x=>x.unitats.includes(c));if(!m)return false;
  stack=[["home"],["maquina",m.n]];render();return true}
if(!fromHash()){stack=[["home"]];render()}
carrega();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
window.addEventListener("hashchange",fromHash);
</script>
